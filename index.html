<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calisthenics Workout</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="nav-inner">
      <nav class="day-nav" id="day-nav" aria-label="Workout days"></nav>
    </div>
  </header>

  <main id="content">
    <p class="status">Loading workout…</p>
  </main>

  <button type="button" class="slide-arrow slide-arrow--prev" id="prev-btn" aria-label="Previous day">‹</button>
  <button type="button" class="slide-arrow slide-arrow--next" id="next-btn" aria-label="Next day">›</button>

  <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
  <script>
    // README sections that are for GitHub only, not the app
    const HIDDEN_SECTIONS = new Set(['calisthenics-workout', 'week-at-a-glance']);

    const DAY_IDS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
    const PLAN_FILE = 'README.md';

    function slugify(text) {
      return text
        .toLowerCase()
        .trim()
        .replace(/[^\w\s-]/g, '')
        .replace(/\s+/g, '-');
    }

    function sectionTitle(markdown) {
      const md = markdown.match(/^#{1,3}\s+(.+)$/m);
      if (md) return md[1].trim();
      const html = markdown.match(/<h1[^>]*>(.*?)<\/h1>/i);
      if (html) return html[1].replace(/<[^>]+>/g, '').trim();
      return 'Section';
    }

    function todaysId() {
      return DAY_IDS[new Date().getDay()];
    }

    let currentId = null;

    function slides() {
      return [...document.querySelectorAll('.day')];
    }

    function setCurrent(id) {
      if (id === currentId) return;
      currentId = id;
      slides().forEach((el) => {
        const isCurrent = el.id === id;
        el.classList.toggle('is-current', isCurrent);
        el.setAttribute('aria-hidden', String(!isCurrent));
      });
      setActiveNav(id);
      document
        .querySelector(`.day-nav a[href="#${id}"]`)
        ?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      history.replaceState(null, '', `#${id}`);

      const all = slides();
      const index = all.findIndex((el) => el.id === id);
      document.getElementById('prev-btn').disabled = index <= 0;
      document.getElementById('next-btn').disabled = index >= all.length - 1;
    }

    function goToSlide(id, behavior = 'smooth') {
      const content = document.getElementById('content');
      const el = document.getElementById(id);
      if (!el || !el.classList.contains('day')) return;
      const left = el.offsetLeft - (content.clientWidth - el.offsetWidth) / 2;
      content.scrollTo({ left, behavior });
      setCurrent(id);
    }

    function stepSlide(delta) {
      const all = slides();
      const index = all.findIndex((el) => el.id === currentId);
      const next = all[index + delta];
      if (next) goToSlide(next.id);
    }

    // Whichever slide is closest to the center of the carousel is current
    function syncCurrentFromScroll() {
      const content = document.getElementById('content');
      const center = content.scrollLeft + content.clientWidth / 2;
      let closest = null;
      let distance = Infinity;
      for (const el of slides()) {
        const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - center);
        if (d < distance) {
          distance = d;
          closest = el;
        }
      }
      if (closest) setCurrent(closest.id);
    }

    function setActiveNav(id) {
      document.querySelectorAll('.day-nav a').forEach((link) => {
        link.classList.toggle('is-active', link.getAttribute('href') === `#${id}`);
      });
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    // "**Name** · sets — how-to" → { name, sets, how }
    function parseItem(li) {
      const strong = li.querySelector('strong');
      const name = strong ? strong.textContent.trim() : li.textContent.trim();
      const rest = strong ? li.textContent.slice(li.textContent.indexOf(name) + name.length) : '';
      const [meta, ...how] = rest.split(' — ');
      return {
        name,
        sets: meta.replace(/^\s*·\s*/, '').trim(),
        how: how.join(' — ').trim(),
      };
    }

    // Turn a rendered day section into a glanceable card:
    // icon, movement, sets × reps up top; how-to and options tucked into one toggle
    function buildCard(article, isToday) {
      const heading = article.querySelector('h2');
      const sub = article.querySelector('h3');
      const icon = article.querySelector('img');
      const [focus, move] = (sub ? sub.textContent : '').split(' — ').map((t) => t?.trim());

      // Group "**Label**" paragraphs with the list that follows them
      const isLabel = (node) =>
        node.tagName === 'P' &&
        node.firstElementChild?.tagName === 'STRONG' &&
        node.textContent.trim() === node.firstElementChild.textContent.trim();
      const groups = {};
      const lists = [];
      const extras = [];
      const nodes = [...article.children];
      for (let i = 0; i < nodes.length; i++) {
        const node = nodes[i];
        if (node === heading || node === sub || node.contains(icon)) continue;
        if (isLabel(node) && nodes[i + 1]?.tagName === 'UL') {
          groups[node.textContent.trim().toLowerCase()] = [...nodes[++i].children];
        } else if (node.tagName === 'UL') {
          lists.push(node);
        } else {
          extras.push(node);
        }
      }

      const main = groups['main movement']?.[0] && parseItem(groups['main movement'][0]);
      const finishers = (groups['finisher'] || groups['finishers'] || []).map(parseItem);
      const options = groups['easier / harder'] || [];

      const card = el('div', 'card');
      if (isToday) card.append(el('div', 'day-label', 'Today'));
      card.append(el('p', 'card-day', heading?.textContent.trim()));
      if (focus) card.append(el('p', 'card-focus', focus));
      if (icon) {
        icon.className = 'card-icon';
        card.append(icon);
      }
      card.append(el('h2', 'card-move', main ? main.name : move || focus));
      if (main?.sets) card.append(el('p', 'card-sets', main.sets));

      if (finishers.length) {
        const list = el('ul', 'card-finishers');
        for (const f of finishers) {
          const li = el('li');
          li.append(el('span', 'card-then', 'then'), el('strong', null, f.name));
          if (f.sets) li.append(el('span', 'card-finisher-sets', f.sets));
          list.append(li);
        }
        card.append(list);
      }

      // Days without a main movement (recovery) show their list right on the card
      for (const list of lists) {
        list.className = 'card-list';
        card.append(list);
      }

      const more = el('details', 'card-more');
      more.append(el('summary', null, main ? 'How to' : 'Details'));
      const body = el('div', 'card-more-body');
      for (const item of [main, ...finishers].filter((i) => i?.how)) {
        const p = el('p');
        p.append(el('strong', null, item.name), ` — ${item.how}`);
        body.append(p);
      }
      if (options.length) {
        const ul = el('ul');
        ul.append(...options);
        body.append(ul);
      }
      // Anything else (e.g. Sunday's list, tips) keeps its markdown rendering
      body.append(...extras);
      if (body.children.length) {
        more.append(body);
        card.append(more);
      }

      article.replaceChildren(card);
    }

    async function render(targetId) {
      const content = document.getElementById('content');
      const nav = document.getElementById('day-nav');

      let markdown;
      try {
        const res = await fetch(PLAN_FILE, { cache: 'no-cache' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        markdown = await res.text();
      } catch (err) {
        content.innerHTML = `<p class="status">Couldn’t load ${PLAN_FILE}. Serve this folder over HTTP (npm run serve).</p>`;
        console.error(err);
        return;
      }

      const chunks = markdown
        .split(/\n---\n/)
        .map((chunk) => chunk.trim())
        .filter(Boolean);

      const today = todaysId();
      content.innerHTML = '';
      nav.innerHTML = '';

      for (const chunk of chunks) {
        const title = sectionTitle(chunk);
        const id = slugify(title);
        const isToday = id === today;
        if (HIDDEN_SECTIONS.has(id)) continue;

        const article = document.createElement('article');
        article.className = `day${isToday ? ' is-today' : ''}`;
        article.id = id;
        article.innerHTML = marked.parse(chunk);
        buildCard(article, isToday);
        content.appendChild(article);

        const link = document.createElement('a');
        link.href = `#${id}`;
        link.setAttribute('aria-label', isToday ? `${title} (today)` : title);
        link.title = title;
        if (isToday) link.classList.add('is-today-link');
        nav.appendChild(link);
      }

      currentId = null;
      const target = document.getElementById(targetId) || document.getElementById(today);
      const first = target && target.classList.contains('day') ? target : content.querySelector('.day');
      if (first) {
        // Wait a tick so layout is ready
        requestAnimationFrame(() => goToSlide(first.id, 'instant'));
      }
    }

    function init() {
      const nav = document.getElementById('day-nav');
      nav.addEventListener('click', (event) => {
        const link = event.target.closest('a');
        if (!link) return;
        event.preventDefault();
        goToSlide(link.getAttribute('href').slice(1));
      });

      const content = document.getElementById('content');
      let scrollFrame = null;
      content.addEventListener('scroll', () => {
        if (scrollFrame) return;
        scrollFrame = requestAnimationFrame(() => {
          scrollFrame = null;
          syncCurrentFromScroll();
        });
      });

      // Tapping a faded neighbor brings it to the center instead of opening things inside it
      content.addEventListener(
        'click',
        (event) => {
          const slide = event.target.closest('.day');
          if (!slide || slide.classList.contains('is-current')) return;
          event.preventDefault();
          event.stopPropagation();
          goToSlide(slide.id);
        },
        true
      );

      document.getElementById('prev-btn').addEventListener('click', () => stepSlide(-1));
      document.getElementById('next-btn').addEventListener('click', () => stepSlide(1));

      document.addEventListener('keydown', (event) => {
        if (event.target.closest('input, textarea')) return;
        if (event.key === 'ArrowLeft') stepSlide(-1);
        if (event.key === 'ArrowRight') stepSlide(1);
      });

      window.addEventListener('resize', () => currentId && goToSlide(currentId, 'instant'));
      window.addEventListener('hashchange', () => goToSlide(location.hash.slice(1)));

      const initialId =
        location.hash && location.hash.length > 1
          ? location.hash.slice(1)
          : todaysId();

      render(initialId);
    }

    init();
  </script>
</body>
</html>
